buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

apply plugin: 'org.spongepowered.mixin'


tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def mod_version = '0.2.6-beta-forge-1.20.1'

def mod_changelog = '''
### 0.2.6-beta-forge-1.20.1-port.1

> Unofficial Forge 1.20.1 port of MoreTraffic 0.2.6-beta.

Port changes:
- Ported the mod from NeoForge 1.21.1 to Forge 1.20.1.
- Migrated the project to Java 17.
- Reworked networking for Forge SimpleChannel.
- Ported block interactions, menus, GUI registration and configuration.
- Updated integrations with Create, Flywheel, Ponder, TrafficCraft and DragonLib.
- Updated mixins and rendering compatibility.
- Added dedicated server compatibility.

Original 0.2.6-beta changes:
- Added Exposed Concrete with variants.
- Added copying and duplicating elements in Signboard.
- Centered Signboards on blocks.
- Added customizable Signboard background size.
- Fixed Signboard saving and mouse focus issues.
- Fixed Signboard element rendering.
- Fixed LED Strip placement outside block bounds.
- Reworked recipes.
'''

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    maven { url = 'https://maven.architectury.dev' }
    mavenCentral()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', project.mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }

        gameTestServer {}

        data {
            workingDirectory project.file('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("maven.modrinth:Y1PXWvWn:${trafficcraft_version_id}")
    implementation fg.deobf("maven.modrinth:sbIsGaOV:${dragonlib_version_id}")
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")) {
        transitive = false
    }
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1')
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range   : minecraft_version_range,
            forge_version_range       : forge_version_range,
            loader_version_range      : loader_version_range,
            create_version_range      : create_version_range,
            trafficcraft_version_range: trafficcraft_version_range,
            dragonlib_version_range   : dragonlib_version_range,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_license               : mod_license,
            mod_version               : mod_version,
            mod_authors               : mod_authors,
            mod_description           : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
tasks.named('processResources').configure { dependsOn generateModMetadata }

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'           : 'moretraffic.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = mod_changelog
    type = me.modmuss50.mpp.ReleaseType.BETA
    modLoaders.add('forge')

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_PAT')
        projectId = 'ehd4WTU1'
        minecraftVersions.add('1.20.1')
    }

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_PAT')
        projectId = '1487775'
        client = true
        server = true
        minecraftVersions.add('1.20.1')
    }

    github {
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        repository = 'tomas65107/moretraffic'
        commitish = 'forge-1.20.1'
        tagName = "v${project.version}"
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

mixin {
    add sourceSets.main, 'moretraffic.refmap.json'
    config 'moretraffic.mixins.json'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.named('compileJava', JavaCompile).configure {
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'))
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
